<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Photo Sorter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div id="content">
    <div id="dragbar" data-tauri-drag-region></div>
    <div id="progress" hidden>
      <div class="plabel"><span id="ptext"></span><span id="pnum"></span></div>
      <div class="pbar"><i id="pfill"></i></div>
    </div>
    <main id="main"></main>
  </div>
  <div id="zoom" hidden><img alt=""></div>
  <div id="toast" hidden></div>
  <script src="i18n.js"></script><script src="lang/uk.js"></script><script src="lang/es.js"></script><script src="lang/pt.js"></script><script src="lang/fr.js"></script><script src="lang/de.js"></script><script src="lang/it.js"></script><script src="lang/pl.js"></script><script src="lang/tr.js"></script><script src="lang/zh.js"></script><script src="lang/ja.js"></script><script src="lang/ko.js"></script>
  <script src="app.js"></script>
</body>
</html>

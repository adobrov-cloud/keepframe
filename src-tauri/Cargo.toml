[package]
name = "photo-sorter"
version = "0.4.0"
edition = "2021"

[lib]
name = "photo_sorter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
fs2 = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
kamadak-exif = "0.5"
jpeg-decoder = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
filetime = "0.2"
chrono = "0.4"

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "test"] }

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Photo Sorter</title>
  <link rel="stylesheet" href="../ui/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div id="content">
    <div id="dragbar" data-tauri-drag-region></div>
    <div id="progress" hidden>
      <div class="plabel"><span id="ptext"></span><span id="pnum"></span></div>
      <div class="pbar"><i id="pfill"></i></div>

    <main id="main"></main>
  </div>
  <div id="zoom" hidden><img alt=""></div>
  <div id="toast" hidden></div>
  <script src="mock.js"></script><script src="../ui/i18n.js"></script>
  <script src="../ui/app.js"></script>
</body>
</html>
